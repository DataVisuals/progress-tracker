services:
  progress-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: progress-tracker
    ports:
      - "3001:3001"
    volumes:
      # Persist database
      - ./backend/data:/app/backend/data
      # Optional: mount env file if needed
      # - ./.env:/app/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: progress-tracker-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - progress-tracker
    restart: unless-stopped
    profiles:
      - production

volumes:
  data:
    driver: local
